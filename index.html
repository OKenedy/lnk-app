          <div class="card-actions">
            ${mentor.isDemo && !isOwn ? `<button class="button" type="button" data-action="demo-chat" data-id="${escapeHtml(mentor.id)}">Try demo chat</button><button class="button secondary" type="button" data-action="book-session" data-id="${escapeHtml(mentor.id)}">Try demo booking</button>` : !isOwn ? `<a class="button" href="mailto:${encodeURIComponent(email)}?subject=${contactSubject}&body=${contactBody}">Message / share a file</a><button class="button secondary" type="button" data-action="book-session" data-id="${escapeHtml(mentor.id)}">Request a session</button>` : ""}
            ${mentor.isDemo || isOwn ? "" : isIncoming ? `<button class="button secondary" type="button" data-action="save-mentor" data-id="${escapeHtml(mentor.id)}">Save mentor</button>` : `<button class="button secondary" type="button" data-action="remove-mentor" data-id="${escapeHtml(mentor.id)}">Remove</button>`}
          </div>
          ${mentor.isDemo && !isOwn ? '<p class="help">This is a fictional bot. Chat replies and bookings are simulated; no real person is contacted.</p>' : !isOwn ? '<p class="help">Messages and file attachments are handled in your email app, not stored in LNK. A session is not booked until the mentor confirms.</p>' : ""}
        </article>`;
      }

      function matchingMentors() {
        const savedIds = new Set(state.connections.map((mentor) => mentor.id));
        const incoming = incomingMentor && state.profile.role === "mentee" && !savedIds.has(incomingMentor.id) ? incomingMentor : null;
        const imported = [...(incoming ? [incoming] : []), ...state.connections.filter((mentor) => !incoming || mentor.id !== incoming.id)];
        const mentors = [...imported, ...demoMentors];
        const selectedCourse = matchFilters.applied ? matchFilters.course : (matchRequest ? matchQuery : "");
        const formatMatches = (mentor) => !matchFilters.applied || !matchFilters.format
          || mentor.format === matchFilters.format || mentor.format === "Online or in person";
        const availabilityMatches = (mentor) => !matchFilters.applied || !matchFilters.availability
          || String(mentor.availability || "").toLowerCase().includes(matchFilters.availability.toLowerCase());
        const rateMatches = (mentor) => {
          if (!matchFilters.applied || !matchFilters.rate) return true;
          const rate = String(mentor.rate || "").toLowerCase();
          const isFree = /\bfree\b|no charge|volunteer/i.test(rate);
          const isPaid = Boolean(rate) && !isFree;
          return matchFilters.rate === "free" ? isFree : isPaid;
        };
        return mentors.filter((mentor) => {
          const subjectText = (mentor.subjects || []).join(" ").toLowerCase();
          const courseMatches = !selectedCourse || subjectText.includes(selectedCourse.toLowerCase());
          return courseMatches
            && (!matchFilters.applied || !matchFilters.programme || mentor.programme === matchFilters.programme)
            && (!matchFilters.applied || !matchFilters.level || String(mentor.level) === matchFilters.level)
            && formatMatches(mentor)
            && availabilityMatches(mentor)
            && rateMatches(mentor);
        });
      }

      function renderMatches() {
        const mentors = matchingMentors();
        const filteredMentors = selectedMatchId ? mentors.filter((mentor) => mentor.id === selectedMatchId) : mentors;
        const incomingIsNew = Boolean(incomingMentor && state.profile.role === "mentee"
          && !state.connections.some((mentor) => mentor.id === incomingMentor.id));
        const filterProgramme = matchFilters.programme || state.profile.programme;
        const filterLevel = matchFilters.level || String(state.profile.level);
        const courseOptions = coursesFor(filterProgramme, filterLevel);
        return `<p class="eyebrow">Mentee workspace</p><h1>Find a mentor</h1>
          <p class="intro">Match with tutors whose shared profiles fit your course, study level, availability and meeting format. You can still add a mentor directly with their profile link or try a clearly labeled demo bot.</p>
          ${incomingIsNew ? `<div class="match-banner"><strong>A mentor profile was shared with you.</strong><p>Review their courses and details, then save the profile or contact them by email.</p></div>` : ""}
          <section class="card match-filters">
            <h2>What kind of mentor are you looking for?</h2>
            <p class="muted">Choose any filters, then match with all suitable shared profiles or pick one at random. Random match only chooses from profiles available below.</p>
            <form data-form="matching">
              <div class="match-filter-grid">
                <div class="field"><label for="matchSubject">Course or topic</label><select class="input" id="matchSubject" name="course"><option value="">Any course</option>${selectOptions(courseOptions, matchFilters.course || (matchRequest ? matchQuery : ""))}</select></div>
                <div class="field"><label for="matchProgramme">Programme</label><select class="input" id="matchProgramme" name="programme"><option value="">Any programme</option>${selectOptions(Object.keys(programmes), matchFilters.programme)}</select></div>
                <div class="field"><label for="matchLevel">Mentor study level</label><select class="input" id="matchLevel" name="level"><option value="">Any level</option>${selectOptions(["100", "200", "300", "400"], matchFilters.level)}</select></div>
                <div class="field"><label for="matchFormat">Meeting format</label><select class="input" id="matchFormat" name="format"><option value="">Any format</option>${selectOptions(["Online", "In person"], matchFilters.format)}</select></div>
                <div class="field"><label for="matchAvailability">Availability</label><select class="input" id="matchAvailability" name="availability"><option value="">Any availability</option>${selectOptions(availabilityOptions(), matchFilters.availability)}</select></div>
                <div class="field"><label for="matchRate">Session rate</label><select class="input" id="matchRate" name="rate"><option value="">Any rate</option>${selectOptions(["free", "paid"], matchFilters.rate, "")}</select></div>
              </div>
              <div class="match-controls"><button class="button" type="submit">Match me</button><button class="button secondary" type="button" data-action="random-match">Random match</button><button class="button secondary" type="button" data-action="clear-match-filters">Clear filters</button></div>
            </form>
            <p class="help">Course options are based on the current in-app list, which is not yet a verified complete PAU curriculum. Check the <a href="https://pau.edu.ng/" target="_blank" rel="noopener noreferrer">PAU website</a> and <a href="https://pauarchive.com/dashboard" target="_blank" rel="noopener noreferrer">PAU Archive</a> for current courses; Archive requires an account.</p>
          </section>
          <div class="card">
            <h2>Open a mentor’s shared link</h2>
            <p class="muted">Ask your mentor to send their LNK profile link. Paste it below to add their profile to your private list.</p>
            <form class="row-form" data-form="mentor-link"><label class="sr-only" for="mentorLink">Mentor profile link</label><input class="input" id="mentorLink" type="url" name="link" placeholder="Paste the mentor profile link" required><button class="button" type="submit">Find mentor</button></form>
          </div>
          <div class="section-heading match-results"><h2>${selectedMatchId ? (randomMatch ? "Your random match" : "Matching tutor") : "Matching tutors"}</h2><span class="muted">${filteredMentors.length} found</span></div>
          ${filteredMentors.length ? filteredMentors.map((mentor) => mentorCard(mentor, incomingIsNew && mentor.id === incomingMentor?.id)).join("") : sectionEmpty("No mentors match those filters", "Try changing a filter, choose Random match again, or paste a mentor profile link above. Fictional demo bots are listed when filters allow.", null, null)}
          <p class="page-footer">Profile links include the mentor’s contact details. LNK currently matches only profiles shared with you; your filters and random choice run on this device.</p>`;
      }

      function mentorRatingForm(mentor) {
        const rating = state.mentorRatings[mentor.id];
        return `<form class="modal-form" data-form="mentor-rating" data-id="${escapeHtml(mentor.id)}">
          <div class="field"><label for="mentorRating">Your rating</label><select class="input" id="mentorRating" name="score" required>${selectOptions(["1", "2", "3", "4", "5"], String(rating?.score || ""), "Choose 1 to 5 stars")}</select></div>
          <div class="field"><label for="mentorReview">Private note <span class="muted">(optional)</span></label><textarea class="input" id="mentorReview" name="review" maxlength="300" placeholder="A reminder for yourself about this mentoring session">${escapeHtml(rating?.review || "")}</textarea></div>
          <p class="help">This is personal feedback saved only in this browser. It is not a public or verified tutor rating.</p>
          <button class="button full" type="submit">Save my private rating</button>
        </form>`;
      }

      function bookingForm(mentor) {
        return `<form class="modal-form" data-form="booking" data-id="${escapeHtml(mentor.id)}">
          <div class="field"><label for="sessionSubject">Course or topic</label><input class="input" id="sessionSubject" name="subject" maxlength="100" value="${escapeHtml(matchQuery || mentor.subjects[0] || "")}" required></div>
          <div class="form-grid">
            <div class="field"><label for="sessionDate">Preferred date</label><input class="input" id="sessionDate" name="date" type="date" min="${localDate()}" required></div>
            <div class="field"><label for="sessionTime">Preferred time</label><input class="input" id="sessionTime" name="time" type="time" required></div>
          </div>
          <div class="field"><label for="sessionMessage">Message <span class="muted">(optional)</span></label><textarea class="input" id="sessionMessage" name="message" maxlength="500" placeholder="What would you like to cover?"></textarea></div>
          <p class="help">${mentor.isDemo ? "This fictional bot will show a simulated confirmation. No tutor is contacted and no real appointment is booked." : "This prepares a booking request in your email app. Your session is not booked until the mentor replies and confirms."}</p>
          <button class="button full" type="submit">${mentor.isDemo ? "Run demo booking" : "Prepare session request"}</button>
        </form>`;
      }

      function demoChatMarkup() {
        const messages = demoChatMessages.map((message) =>
          `<p class="availability-item"><strong>${message.from === "you" ? "You" : escapeHtml(demoChatMentor.name)}:</strong><span>${escapeHtml(message.text)}</span></p>`
        ).join("");
        return `<div aria-live="polite">${messages || '<p class="help">Say hello to try a simulated tutor conversation.</p>'}</div>
          <form class="modal-form" data-form="demo-chat" data-id="${escapeHtml(demoChatMentor.id)}">
            <div class="field"><label for="demoMessage">Message the demo bot</label><textarea class="input" id="demoMessage" name="message" maxlength="300" placeholder="Ask a study question..." required></textarea></div>
            <div class="field"><label for="demoFile">Try attaching a file <span class="muted">(stays on this device)</span></label><input class="input" id="demoFile" name="file" type="file"></div>
            <p class="help">This is a fictional local chat. Messages and files are not uploaded or sent anywhere.</p>
            <button class="button full" type="submit">Send demo message</button>
          </form>`;
      }

      function updateMatchingCourses(form) {
        const courseSelect = $("#matchSubject", form);
        const programme = $("#matchProgramme", form)?.value || state.profile.programme;
        const level = $("#matchLevel", form)?.value || String(state.profile.level);
        const previous = courseSelect.value;
        const courses = coursesFor(programme, level);
        courseSelect.innerHTML = `<option value="">Any course</option>${selectOptions(courses, courses.includes(previous) ? previous : "")}`;
      }

      function matchingAnimation(random) {
        const particles = Array.from({ length: 18 }, (_, index) => `<i style="--i:${index};--angle:${index * 20}deg"></i>`).join("");
        return `<div class="match-animation" role="status" aria-live="polite">
          <div class="match-orbit" aria-hidden="true"></div><div class="match-particles" aria-hidden="true">${particles}</div>
          <p class="match-status">${random ? "Finding a random fit..." : "Combining your filters..."}</p>
        </div>`;
      }

      function startMatching(random = false, form = null) {
        if (form) {
          const data = new FormData(form);
          matchFilters = {
            course: String(data.get("course") || ""),
            programme: String(data.get("programme") || ""),
            level: String(data.get("level") || ""),
            format: String(data.get("format") || ""),
            availability: String(data.get("availability") || "").trim().slice(0, 60),
            rate: String(data.get("rate") || ""),
            applied: true
          };
          matchQuery = matchFilters.course;
          matchRequest = false;
        }
        selectedMatchId = "";
        randomMatch = false;
        const candidates = matchingMentors();
        showModal("Finding your match", "LNK is comparing the filters you chose with mentor profiles shared with you.", matchingAnimation(random));
        window.setTimeout(() => {
          closeModal();
          if (!candidates.length) {
            render();
            showToast("No shared mentor profile matches those filters. Try broadening your choices.");
            return;
          }
          if (random) {
            const selection = candidates[Math.floor(Math.random() * candidates.length)];
            selectedMatchId = selection.id;
            randomMatch = true;
          }
          render();
          showToast(random ? "Your random mentor match is ready." : `${candidates.length} matching mentor${candidates.length === 1 ? "" : "s"} found.`);
        }, 1450);
      }

      function findMentor(id) {
        if (incomingMentor?.id === id && state.profile.role === "mentee") return incomingMentor;
        return state.connections.find((mentor) => mentor.id === id)
          || demoMentors.find((mentor) => mentor.id === id)
          || null;
      }

      function handleMentorRating(form) {
        const id = form.dataset.id;
        const mentor = findMentor(id);
        const data = new FormData(form);
        const score = Number(data.get("score"));
        const review = String(data.get("review") || "").trim();
        if (!mentor || !Number.isInteger(score) || score < 1 || score > 5 || review.length > 300) {
          showToast("Choose a rating from 1 to 5 stars and check your note.");
          return;
        }
        if (commit((next) => {
          next.mentorRatings[id] = { score, review, ratedAt: new Date().toISOString() };
        })) {
          closeModal();
          render();
          showToast("Your private rating was saved on this device.");
        }
      }

      function handleBooking(form) {
        const mentor = findMentor(form.dataset.id);
        const data = new FormData(form);
        const subject = String(data.get("subject") || "").trim();
        const date = String(data.get("date") || "");
        const time = String(data.get("time") || "");
        const message = String(data.get("message") || "").trim();
        if (!mentor || !subject || subject.length > 100 || !date || date < localDate() || !time || message.length > 500) {
          showToast("Choose a topic, today or a future date, and a preferred time.");
          return;
        }
        if (mentor.isDemo) {
          const booking = { id: uid(), mentorId: mentor.id, subject, date, time, message, createdAt: new Date().toISOString(), demo: true };
          if (commit((next) => { next.demoBookings.unshift(booking); next.demoBookings = next.demoBookings.slice(0, 50); })) {
            closeModal();
            showModal("Demo booking complete", "This is a simulated flow only. No real tutor was contacted and no appointment was booked.", `<section class="card"><span class="badge">DEMO ONLY</span><h3>${escapeHtml(mentor.name)}</h3><p>${escapeHtml(subject)}</p><p class="muted">${escapeHtml(formatDate(date))} at ${escapeHtml(time)}</p><p class="help">In the full LNK service, this step would send a request to a real tutor for confirmation.</p></section>`);
          }
          return;
        }
        const body = encodeURIComponent(`Hello ${mentor.name},\n\nI’d like to request a mentoring session about ${subject}.\nMy preferred time is ${formatDate(date)} at ${time}.\n${message ? `\nA bit more about what I need:\n${message}\n` : ""}\nPlease let me know if you’re available. I understand this request is not a confirmed booking until you reply.\n`);
        const mailto = `mailto:${encodeURIComponent(mentor.email)}?subject=${encodeURIComponent(`LNK session request: ${subject}`)}&body=${body}`;
        showModal("Session request ready", "LNK prepared an email. Open it and choose Send; your session is only booked after the mentor confirms.", `<div class="card"><p><strong>${escapeHtml(mentor.name)}</strong></p><p class="muted">${escapeHtml(subject)} · ${escapeHtml(formatDate(date))} at ${escapeHtml(time)}</p><a class="button full" href="${mailto}">Open email app to request session</a><p class="help">Emailing the request does not guarantee availability. You can attach files in your email app if needed.</p></div>`);
      }

      function handleDemoChat(form) {
        const mentor = demoMentors.find((item) => item.id === form.dataset.id);
        const data = new FormData(form);
        const message = String(data.get("message") || "").trim();
        const file = form.elements.namedItem("file")?.files?.[0];
        if (!mentor || !message || message.length > 300) {
          showToast("Enter a short message to try demo chat.");
          return;
        }
        demoChatMentor = mentor;
        demoChatMessages.push({ from: "you", text: file ? `${message} [Attached locally: ${file.name}]` : message });
        demoChatMessages.push({ from: "bot", text: `Demo reply: Let’s work through that ${mentor.subjects[0]} question together. In the full app, a real tutor would respond here.` });
        $("#modalContent").innerHTML = demoChatMarkup();
        $("#demoMessage").focus();
      }

      function renderMentorProfile() {
        const mentor = savedMentorProfile();
        if (!mentor || !mentor.subjects.length || !mentor.email || !state.profile.mentor.shareConsent) {
          return `<p class="eyebrow">Mentor workspace</p><h1>Your mentor profile</h1>
            <p class="intro">Add the subjects you can teach and an email address so mentees can learn about you and get in touch.</p>
            ${profileForm(true)}`;
        }
        return `<p class="eyebrow">Mentor workspace</p><h1>Your mentor profile</h1>
          <p class="intro">This is the profile mentees see when you share your LNK link. Your public email address is included in that link.</p>
          ${mentorCard(mentor, false, true)}
          <section class="card">
            <h2>Share your profile</h2>
            <p class="muted">Send this link to a mentee. They can open your profile and contact you using their own email app. LNK does not host a public mentor directory.</p>
            <div class="button-row"><button class="button" type="button" data-action="share-mentor">Share mentor link</button><button class="button secondary" type="button" data-action="copy-mentor">Copy mentor link</button><button class="button secondary" type="button" data-action="edit-profile">Edit profile</button></div>
            ${location.protocol === "file:" ? '<p class="help">This page is currently opened as a local file. A file link will only work on your own device. Publish LNK on a web host before sending mentor links to other people.</p>' : ""}
          </section>`;
      }

      function priorityBadge(priority) {
        return priority === "Soon" ? '<span class="badge priority">Help soon</span>' : "";
      }

      function requestCard(request) {
        const done = request.status === "done";
        return `<article class="card" data-searchable="${escapeHtml(`${request.course} ${request.topic} ${request.details || ""}`.toLowerCase())}">
          <div class="request-head"><div><p class="request-course">${escapeHtml(request.course)}</p><h3 class="request-title">${escapeHtml(request.topic)}</h3></div><div class="button-row"><span class="badge ${done ? "done" : ""}">${done ? "Completed" : "To do"}</span>${priorityBadge(request.priority)}</div></div>
          ${request.details ? `<p class="request-details">${escapeHtml(request.details)}</p>` : ""}
          <div class="meta"><span>Added ${formatDate(request.createdAt)}</span></div>
          <div class="card-actions">
            <button class="button secondary small" type="button" data-action="toggle-request" data-id="${escapeHtml(request.id)}">${done ? "Reopen" : "Mark complete"}</button>
            <button class="button secondary small" type="button" data-action="edit-request" data-id="${escapeHtml(request.id)}">Edit</button>
            ${state.profile?.role === "mentee" ? `<button class="button secondary small" type="button" data-action="find-mentor" data-id="${escapeHtml(request.id)}">Find a mentor for this</button>` : ""}
            <button class="button secondary small" type="button" data-action="plan-from-request" data-id="${escapeHtml(request.id)}">Plan a study session</button>
            <button class="button danger small" type="button" data-action="delete-request" data-id="${escapeHtml(request.id)}">Delete</button>
          </div>
        </article>`;
      }

      function planCard(plan) {
        return `<article class="card" data-searchable="${escapeHtml(`${plan.course} ${plan.topic} ${plan.notes || ""}`.toLowerCase())}">
          <div class="item-head"><div><p class="request-course">${escapeHtml(plan.course)}</p><h3>${escapeHtml(plan.topic)}</h3></div><span class="badge">${plan.status === "done" ? "Completed" : "Planned"}</span></div>
          <p class="meta"><span>${formatDate(plan.date)}</span><span>${escapeHtml(plan.time)}</span></p>
          ${plan.notes ? `<p class="request-details">${escapeHtml(plan.notes)}</p>` : ""}
          <div class="card-actions">
            <button class="button secondary small" type="button" data-action="toggle-plan" data-id="${escapeHtml(plan.id)}">${plan.status === "done" ? "Reopen plan" : "Mark complete"}</button>
            <button class="button secondary small" type="button" data-action="edit-plan" data-id="${escapeHtml(plan.id)}">Edit</button>
            <button class="button danger small" type="button" data-action="delete-plan" data-id="${escapeHtml(plan.id)}">Delete</button>
          </div>
        </article>`;
      }

      function groupInvite(group) {
        const when = group.date ? ` on ${formatDate(group.date)}${group.time ? ` at ${group.time}` : ""}` : "";
        return `Study group: ${group.name}\nCourse: ${group.course}${when}\n${group.details || "Let’s study together."}\n\nPlease contact me directly if you’d like to join.`;
      }

      function groupCard(group) {
        return `<article class="card" data-searchable="${escapeHtml(`${group.name} ${group.course} ${group.details || ""}`.toLowerCase())}">
          <div class="item-head"><div><p class="request-course">${escapeHtml(group.course)}</p><h3>${escapeHtml(group.name)}</h3></div><span class="badge">Invitation draft</span></div>
          ${group.date ? `<p class="meta"><span>${formatDate(group.date)}${group.time ? ` · ${escapeHtml(group.time)}` : ""}</span></p>` : ""}
          ${group.details ? `<p class="request-details">${escapeHtml(group.details)}</p>` : ""}
          <p class="help">This draft is private. Share it yourself to invite classmates; it does not create a real group or notify anyone.</p>
          <div class="card-actions">
            <button class="button small" type="button" data-action="share-group" data-id="${escapeHtml(group.id)}">Share invitation</button>
            <button class="button secondary small" type="button" data-action="edit-group" data-id="${escapeHtml(group.id)}">Edit</button>
            <button class="button danger small" type="button" data-action="delete-group" data-id="${escapeHtml(group.id)}">Delete</button>
          </div>
        </article>`;
      }

      function sectionEmpty(title, description, action, label) {
        return `<div class="empty"><h3>${title}</h3><p>${description}</p>${action ? `<button class="button small" type="button" data-action="${action}">${label}</button>` : ""}</div>`;
      }

      function renderHome() {
        const profile = state.profile;
        if (profile.role === "mentor") {
          const mentor = savedMentorProfile();
          const complete = mentor?.subjects.length && mentor.email && profile.mentor.shareConsent;
          return `<p class="eyebrow">Mentor workspace</p>
            <h1>Welcome, ${escapeHtml(profile.name.split(/\s+/)[0])}.</h1>
            <p class="muted">${escapeHtml(profile.programme)} · ${escapeHtml(profile.level)} level</p>
            ${workspaceNotice()}
            <section class="hero"><h2>Share what you know.</h2><p>Tell mentees which subjects you can teach, add your availability, and share your profile link so they can contact you.</p><div class="button-row"><button class="button" type="button" data-action="navigate" data-view="mentor">${complete ? "View and share my profile" : "Finish my mentor profile"}</button></div></section>
            ${complete ? mentorCard(mentor, false, true) : sectionEmpty("Complete your mentor details", "Add your teaching subjects, contact email, and consent to create a shareable mentor link.", "navigate-mentor", "Finish mentor profile")}
            <section class="card"><h2>How mentees reach you</h2><div class="availability-list"><div class="availability-item"><strong>1.</strong><span>Share your mentor profile link directly with a mentee.</span></div><div class="availability-item"><strong>2.</strong><span>They review your subjects and availability.</span></div><div class="availability-item"><strong>3.</strong><span>They email you to arrange a session.</span></div></div><p class="help">Your email is visible to anyone who has your share link. LNK does not publish an open directory or store messages.</p></section>
            <p class="page-footer">The profile on this device is local. For other people to open your share link, LNK must be hosted online.</p>`;
        }
        const openRequests = state.requests.filter((item) => item.status !== "done").length;
        const upcoming = state.plans.filter((item) => item.status !== "done").length;
        return `<p class="eyebrow">Your workspace</p>
          <h1>Welcome back, ${escapeHtml(profile.name.split(/\s+/)[0])}.</h1>
          <p class="muted">Mentee · ${escapeHtml(profile.programme)} · ${escapeHtml(profile.level)} level</p>
          ${storageWarning ? `<p class="privacy-note" role="alert">${escapeHtml(storageWarning)}</p>` : ""}
          ${workspaceNotice()}
          <section class="hero"><h2>Find the right mentor for your course.</h2><p>Search profiles shared with you, compare subjects and availability, then contact a mentor directly.</p><div class="button-row"><button class="button" type="button" data-action="navigate" data-view="matches">Find a mentor</button><button class="button secondary" type="button" data-action="add-request">Add a study request</button></div></section>
          <div class="stats"><div class="stat"><strong>${openRequests}</strong><span>Open study requests</span></div><div class="stat"><strong>${upcoming}</strong><span>Planned study sessions</span></div><div class="stat"><strong>${state.connections.length}</strong><span>Saved mentors</span></div></div>
          ${incomingMentor && !state.connections.some((mentor) => mentor.id === incomingMentor.id) ? `<div class="match-banner"><strong>${escapeHtml(incomingMentor.name)} shared a mentor profile with you.</strong><p>Review their teaching subjects and get in touch.</p><button class="button small" type="button" data-action="navigate" data-view="matches">View shared mentor</button></div>` : ""}
          <div class="section-heading"><h2>Study requests</h2><button class="button secondary small" type="button" data-action="navigate" data-view="requests">View all</button></div>
          ${openRequests ? state.requests.filter((item) => item.status !== "done").slice(0, 3).map(requestCard).join("") : sectionEmpty("Nothing to chase yet", "Add a course and topic to keep track of what you want to understand.", "add-request", "Add a study request")}
          <div class="section-heading"><h2>Next study sessions</h2><button class="button secondary small" type="button" data-action="navigate" data-view="plans">View plans</button></div>
          ${upcoming ? state.plans.filter((item) => item.status !== "done").slice().sort((a, b) => `${a.date} ${a.time}`.localeCompare(`${b.date} ${b.time}`)).slice(0, 2).map(planCard).join("") : sectionEmpty("No sessions planned", "Choose a course and set aside time for it.", "add-plan", "Plan a study session")}
          <p class="page-footer">LNK helps you find mentors through shared profile links. Email is sent from your own email app.</p>`;
      }

      function renderRequests() {
        const open = state.requests.filter((item) => item.status !== "done");
        const done = state.requests.filter((item) => item.status === "done");
        const list = [...open, ...done];
        return `<p class="eyebrow">Keep track</p><h1>Study requests</h1>
          <p class="intro">Save the course and topic you want help with. Use “Find a mentor for this” to look for someone whose shared profile covers that subject.</p>
          <div class="toolbar"><input class="input" type="search" data-search placeholder="Search your requests" aria-label="Search your study requests"><button class="button" type="button" data-action="add-request">Add request</button></div>
          ${list.length ? list.map(requestCard).join("") : sectionEmpty("No requests yet", "Save a course and a topic you want to focus on.", "add-request", "Add your first request")}
          ${list.length ? '<div class="empty" id="searchEmpty" hidden><h3>No matching requests</h3><p>Try another course or topic.</p></div>' : ""}
          ${storageWarning ? `<p class="help" role="alert">${escapeHtml(storageWarning)}</p>` : ""}`;
      }

      function renderPlans() {
        const sorted = state.plans.slice().sort((a, b) => `${a.date} ${a.time}`.localeCompare(`${b.date} ${b.time}`));
        return `<p class="eyebrow">Make time for it</p><h1>Study plans</h1>
          <p class="intro">Set a time and focus for your next study session. Plans are private reminders on this device, not calendar invitations.</p>
          <div class="toolbar"><span class="muted">${state.plans.filter((plan) => plan.status !== "done").length} planned</span><button class="button" type="button" data-action="add-plan">Plan a session</button></div>
          ${sorted.length ? sorted.map(planCard).join("") : sectionEmpty("No study sessions planned", "Pick a course and reserve a little time to work on it.", "add-plan", "Plan a session")}`;
      }

      function renderGroups() {
        return `<p class="eyebrow">Bring people together</p><h1>Study groups</h1>
          <p class="intro">Create an invitation draft to bring classmates together, then share it yourself by text, email or another app. LNK does not publish a shared group directory or find members automatically.</p>
          <div class="toolbar"><span class="muted">${state.groups.length} invitation${state.groups.length === 1 ? "" : "s"}</span><button class="button" type="button" data-action="add-group">Create invitation</button></div>
          ${state.groups.length ? state.groups.slice().reverse().map(groupCard).join("") : sectionEmpty("No invitations yet", "Make a course-specific invitation you can share with people you already know.", "add-group", "Create an invitation")}`;
      }

      function renderProfile() {
        return `<p class="eyebrow">Your details</p><h1>My profile</h1>
          <p class="intro">Your role controls the LNK workspace you see. Change from mentee to mentor or update your study details here.</p>
          ${profileForm(true)}
          <section class="card"><h2>Your data</h2><p class="muted">Export a backup of your profile, study requests, session plans and invitation drafts, or erase this browser’s LNK data.</p>
            <div class="button-row"><button class="button secondary" type="button" data-action="export">Export my data</button><button class="button danger" type="button" data-action="erase">Erase my data</button></div>
          </section>
          <section class="card"><h2>How connections work</h2><p class="muted">Mentees open a mentor’s shared profile link and email them directly. LNK has no password-based login or shared database, so profiles are not discoverable unless someone shares a link with you.</p><p class="help">PAU-only authentication is not yet available. A student email typed into this page would not verify identity, so LNK does not claim that access is restricted to PAU students.</p></section>`;
      }

      function render() {
        setTheme();
        renderNav();
        const main = $("#main");
        if (!state.profile) {
          currentView = "welcome";
          main.innerHTML = renderWelcome();
          return;
        }
        const pages = state.profile.role === "mentor"
          ? { home: renderHome, mentor: renderMentorProfile, plans: renderPlans, groups: renderGroups, profile: renderProfile }
          : { home: renderHome, matches: renderMatches, requests: renderRequests, plans: renderPlans, groups: renderGroups, profile: renderProfile };
        if (!pages[currentView]) currentView = "home";
        main.innerHTML = pages[currentView]();
      }

      function showModal(title, description, content) {
        lastDialogTrigger = document.activeElement;
        $("#modalTitle").textContent = title;
        $("#modalDescription").textContent = description;
        $("#modalContent").innerHTML = content;
        $("#modal").hidden = false;
        document.body.style.overflow = "hidden";
        requestAnimationFrame(() => $("#modalPanelFocus")?.focus() || $("#modalContent input, #modalContent select, #modalContent textarea, #modalContent button")?.focus());
      }

      function closeModal() {
        $("#modal").hidden = true;
        document.body.style.overflow = "";
        lastDialogTrigger?.focus?.();
      }

      function requestForm(request = null) {
        const courses = coursesFor(state.profile.programme, state.profile.level);
        if (request && !courses.includes(request.course)) courses.unshift(request.course);
        const editing = Boolean(request);
        return `<form class="modal-form" data-form="request" data-id="${escapeHtml(request?.id || "")}">
          <div class="field"><label for="requestCourse">Course</label><select class="input" id="requestCourse" name="course" required>${selectOptions(courses, request?.course || "", "Choose a course")}</select></div>
          <div class="field"><label for="requestTopic">What do you want help understanding?</label><input class="input" id="requestTopic" name="topic" maxlength="100" placeholder="e.g. Linked lists or exam revision" value="${escapeHtml(request?.topic || "")}" required></div>
          <div class="field"><label for="requestDetails">Notes <span class="muted">(optional)</span></label><textarea class="input" id="requestDetails" name="details" maxlength="500" placeholder="Add a question, chapter or detail to remember">${escapeHtml(request?.details || "")}</textarea></div>
          <label class="check-row"><input type="checkbox" name="priority" ${request?.priority === "Soon" ? "checked" : ""}><span>Mark this as something I want to work on soon</span></label>
          <p class="help">This saves a private reminder on this device. It does not contact anyone.</p>
          <button class="button full" type="submit">${editing ? "Save changes" : "Save study request"}</button>
        </form>`;
      }

      function planForm(plan = null, request = null) {
        const courses = coursesFor(state.profile.programme, state.profile.level);
        const selectedCourse = plan?.course || request?.course;
        if (selectedCourse && !courses.includes(selectedCourse)) courses.unshift(selectedCourse);
        return `<form class="modal-form" data-form="plan" data-id="${escapeHtml(plan?.id || "")}">
          <div class="field"><label for="planCourse">Course</label><select class="input" id="planCourse" name="course" required>${selectOptions(courses, plan?.course || request?.course || "", "Choose a course")}</select></div>
          <div class="field"><label for="planTopic">What will you focus on?</label><input class="input" id="planTopic" name="topic" maxlength="100" placeholder="e.g. Review lecture notes" value="${escapeHtml(plan?.topic || request?.topic || "")}" required></div>
          <div class="form-grid">
            <div class="field"><label for="planDate">Date</label><input class="input" id="planDate" name="date" type="date" min="${localDate()}" value="${escapeHtml(plan?.date || localDate())}" required></div>
            <div class="field"><label for="planTime">Start time</label><input class="input" id="planTime" name="time" type="time" value="${escapeHtml(plan?.time || "16:00")}" required></div>
          </div>
          <div class="field"><label for="planNotes">Notes <span class="muted">(optional)</span></label><textarea class="input" id="planNotes" name="notes" maxlength="500" placeholder="What should you prepare?">${escapeHtml(plan?.notes || "")}</textarea></div>
          <button class="button full" type="submit">${plan ? "Save changes" : "Save study plan"}</button>
        </form>`;
      }

      function groupForm(group = null) {
        const courses = coursesFor(state.profile.programme, state.profile.level);
        if (group && !courses.includes(group.course)) courses.unshift(group.course);
        return `<form class="modal-form" data-form="group" data-id="${escapeHtml(group?.id || "")}">
          <div class="field"><label for="groupName">Invitation title</label><input class="input" id="groupName" name="name" maxlength="80" placeholder="e.g. CSC 301 revision" value="${escapeHtml(group?.name || "")}" required></div>
          <div class="field"><label for="groupCourse">Course</label><select class="input" id="groupCourse" name="course" required>${selectOptions(courses, group?.course || "", "Choose a course")}</select></div>
          <div class="form-grid">
            <div class="field"><label for="groupDate">Suggested date <span class="muted">(optional)</span></label><input class="input" id="groupDate" name="date" type="date" min="${localDate()}" value="${escapeHtml(group?.date || "")}"></div>
            <div class="field"><label for="groupTime">Suggested time <span class="muted">(optional)</span></label><input class="input" id="groupTime" name="time" type="time" value="${escapeHtml(group?.time || "")}"></div>
          </div>
          <div class="field"><label for="groupDetails">Invitation note <span class="muted">(optional)</span></label><textarea class="input" id="groupDetails" name="details" maxlength="300" placeholder="What would you like the group to cover?">${escapeHtml(group?.details || "")}</textarea></div>
          <p class="help">This creates a message you can share yourself. No group is published and no one is contacted.</p>
          <button class="button full" type="submit">${group ? "Save invitation changes" : "Save invitation draft"}</button>
        </form>`;
      }

      function navigate(view) {
        closeModal();
        currentView = view;
        render();
        $("#main").focus({ preventScroll: true });
        window.scrollTo({ top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "instant" : "smooth" });
      }

      function handleProfile(form) {
        const data = new FormData(form);
        const name = String(data.get("name") || "").trim();
        const programme = String(data.get("programme") || "");
        const level = Number(data.get("level"));
        const role = String(data.get("role") || "");
        const email = String(data.get("email") || "").trim();
        const subjects = [...new Set(String(data.get("subjects") || "").split(",").map((item) => item.trim()).filter(Boolean))].slice(0, 20);
        const bio = String(data.get("bio") || "").trim();
        const availability = String(data.get("availability") || "").trim();
        const format = String(data.get("format") || "Online");
        const rate = String(data.get("rate") || "").trim();
        const shareConsent = data.has("shareConsent");
        if (!name || name.length > 70 || !programmes[programme] || ![100, 200, 300, 400].includes(level)) {
          showToast("Please enter a name, programme and study level.");
          return;
        }
        if (!["mentor", "mentee"].includes(role)) {
          showToast("Choose whether you’re joining LNK as a mentor or mentee.");
          return;
        }
        if (email && (email.length > 120 || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))) {
          showToast("Enter a valid email address.");
          return;
        }
        if (role === "mentor" && (!email || subjects.length === 0 || !shareConsent)) {
          showToast("Mentors need a valid contact email, at least one subject, and consent to create a shareable profile.");
          return;
        }
        if (subjects.some((item) => item.length > 80) || bio.length > 500 || availability.length > 200 || rate.length > 40
          || !["Online", "In person", "Online or in person"].includes(format)) {
          showToast("Please check your mentor profile details and try again.");
          return;
        }
        const previousMentor = state.profile?.mentor || { subjects: [], shareConsent: false };
        if (commit((next) => {
          next.profile = {
            name,
            programme,
            level,
            role,
            email: role === "mentee" ? email : "",
            mentor: role === "mentor"
              ? { email, subjects, bio, availability, format, rate, shareConsent }
              : previousMentor
          };
        })) {
          currentView = "home";
          render();
          showToast(role === "mentor" ? "Your mentor profile is saved on this device." : "Your mentee profile is saved on this device.");
        }
      }

      function readMentorLink(value) {
        try {
          const url = new URL(value);
          if (!["https:", "http:", "file:"].includes(url.protocol)) return null;
          return decodeSharedMentor(new URLSearchParams(url.hash.slice(1)).get("mentor"));
        } catch {
          return null;
        }
      }

      function handleMentorLink(form) {
        const mentor = readMentorLink(String(new FormData(form).get("link") || "").trim());
        if (!mentor) {
          showToast("That link doesn’t contain a valid LNK mentor profile. Ask the mentor to copy their profile link again.");
          return;
        }
        const exists = state.connections.some((item) => item.id === mentor.id);
        if (exists) {
          showToast("This mentor is already in your saved profiles.");
          return;
        }
        if (commit((next) => { next.connections.unshift(mentor); })) {
          matchQuery = "";
          matchRequest = false;
          render();
          showToast(`${mentor.name} was added to your saved mentor profiles.`);
        }
      }

      function mentorShareUrl() {
        const mentor = savedMentorProfile();
        if (!mentor || !state.profile.mentor.shareConsent) return null;
        const url = new URL(location.href);
        url.hash = `mentor=${encodeShare({
          type: "lnk-mentor",
          name: mentor.name,
          email: mentor.email,
          programme: mentor.programme,
          level: mentor.level,
          subjects: mentor.subjects,
          bio: mentor.bio,
          availability: mentor.availability,
          format: mentor.format,
          rate: mentor.rate
        })}`;
        return url.href;
      }

      async function shareMentor(copyOnly = false) {
        const url = mentorShareUrl();
        if (!url) {
          showToast("Complete your mentor profile and agree to share it before creating a link.");
          return;
        }
        if (!copyOnly && navigator.share) {
          try {
            await navigator.share({ title: "My LNK mentor profile", text: "Here’s my mentor profile on LNK.", url });
            return;
          } catch (error) {
            if (error.name === "AbortError") return;
          }
        }
        try {
          await navigator.clipboard.writeText(url);
          showToast("Mentor profile link copied. Share it directly with a mentee.");
        } catch {
          showModal("Copy your mentor profile link", "This link includes your name, subjects and email address. Share it only with people you choose.", `<div class="field"><label for="shareText">Mentor profile link</label><textarea class="input" id="shareText" readonly>${escapeHtml(url)}</textarea></div>`);
          $("#shareText").focus();
          $("#shareText").select();
        }
      }

      function handleRequest(form) {
        const data = new FormData(form);
        const course = String(data.get("course") || "");
        const topic = String(data.get("topic") || "").trim();
        const details = String(data.get("details") || "").trim();
        const id = form.dataset.id;
        if (!coursesFor(state.profile.programme, state.profile.level).includes(course) || !topic || topic.length > 100 || details.length > 500) {
          showToast("Choose a course and enter a short topic.");
          return;
        }
        const existing = state.requests.find((item) => item.id === id);
        const request = {
          id: existing?.id || uid(),
          course,
          topic,
          details,
          priority: data.has("priority") ? "Soon" : "Anytime",
          status: existing?.status || "open",
          createdAt: existing?.createdAt || localDate()
        };
        if (commit((next) => {
          if (existing) next.requests = next.requests.map((item) => item.id === id ? request : item);
          else next.requests.unshift(request);
        })) {
          closeModal();
          render();
          showToast(existing ? "Study request updated." : "Study request saved on this device.");
        }
      }

      function handlePlan(form) {
        const data = new FormData(form);
        const course = String(data.get("course") || "");
        const topic = String(data.get("topic") || "").trim();
        const date = String(data.get("date") || "");
        const time = String(data.get("time") || "");
        const notes = String(data.get("notes") || "").trim();
        const id = form.dataset.id;
        if (!coursesFor(state.profile.programme, state.profile.level).includes(course) || !topic || !date || !time || notes.length > 500) {
          showToast("Choose a course, focus, date and time for your plan.");
          return;
        }
        if (date < localDate()) {
          showToast("Choose today or a future date.");
          return;
        }
        const existing = state.plans.find((item) => item.id === id);
        const plan = { id: existing?.id || uid(), course, topic, date, time, notes, status: existing?.status || "open" };
        if (commit((next) => {
          if (existing) next.plans = next.plans.map((item) => item.id === id ? plan : item);
          else next.plans.unshift(plan);
        })) {
          closeModal();
          render();
          showToast(existing ? "Study plan updated." : "Study session planned.");
        }
      }

      function handleGroup(form) {
        const data = new FormData(form);
        const name = String(data.get("name") || "").trim();
        const course = String(data.get("course") || "");
        const date = String(data.get("date") || "");
        const time = String(data.get("time") || "");
        const details = String(data.get("details") || "").trim();
        const id = form.dataset.id;
        if (!name || name.length > 80 || !coursesFor(state.profile.programme, state.profile.level).includes(course) || details.length > 300) {
          showToast("Add an invitation title and choose a course.");
          return;
        }
        if (date && date < localDate()) {
          showToast("Choose today or a future date.");
          return;
        }
        const existing = state.groups.find((item) => item.id === id);
        const group = { id: existing?.id || uid(), name, course, date, time, details };
        if (commit((next) => {
          if (existing) next.groups = next.groups.map((item) => item.id === id ? group : item);
          else next.groups.push(group);
        })) {
          closeModal();
          render();
          showToast(existing ? "Invitation draft updated." : "Invitation draft saved. Share it when you’re ready.");
        }
      }

      async function shareGroup(id) {
        const group = state.groups.find((item) => item.id === id);
        if (!group) return;
        const text = groupInvite(group);
        if (navigator.share) {
          try {
            await navigator.share({ title: group.name, text });
            return;
          } catch (error) {
            if (error.name === "AbortError") return;
          }
        }
        try {
          await navigator.clipboard.writeText(text);
          showToast("Invitation copied. Paste it into a message to your classmates.");
        } catch {
          showModal("Copy your invitation", "Select and copy this text, then share it using your preferred messaging app.", `<div class="field"><label for="shareText">Invitation text</label><textarea class="input" id="shareText" readonly>${escapeHtml(text)}</textarea></div><button class="button full" type="button" data-action="copy-invite" data-id="${escapeHtml(id)}">Try copy again</button>`);
          $("#shareText").focus();
          $("#shareText").select();
        }
      }

      function exportData() {
        const backup = { app: "LNK mentor matching", version: state.version, exportedAt: new Date().toISOString(), data: state };
        const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `lnk-data-${localDate()}.json`;
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        showToast("Your data backup was downloaded.");
      }

      async function copyInvite(id) {
        const group = state.groups.find((item) => item.id === id);
        if (!group) return;
        try {
          await navigator.clipboard.writeText(groupInvite(group));
          closeModal();
          showToast("Invitation copied.");
        } catch {
          $("#shareText")?.select();
          showToast("Copy is unavailable here. Select the text and copy it manually.");
        }
      }

      function handleAction(button) {
        const action = button.dataset.action;
        const id = button.dataset.id;
        if (action === "home") return navigate(state.profile ? "home" : "welcome");
        if (action === "navigate") {
          if (button.dataset.view === "matches") {
            matchQuery = "";
            matchRequest = false;
          }
          return navigate(button.dataset.view);
        }
        if (action === "navigate-mentor") return navigate("mentor");
        if (action === "edit-profile") return navigate("profile");
        if (action === "share-mentor") return shareMentor();
        if (action === "copy-mentor") return shareMentor(true);
        if (action === "random-match") return startMatching(true, $("form[data-form='matching']"));
        if (action === "clear-match-filters") {
          matchFilters = { course: "", programme: "", level: "", format: "", availability: "", rate: "", applied: false };
          matchQuery = "";
          matchRequest = false;
          selectedMatchId = "";
          randomMatch = false;
          return render();
        }
        if (action === "demo-chat") {
          demoChatMentor = demoMentors.find((mentor) => mentor.id === id) || null;
          if (!demoChatMentor) return;
          demoChatMessages = [];
          showModal("Demo chat · fictional bot", "Try the chat interface. Replies are prewritten examples, not real tutoring.", demoChatMarkup());
          return;
        }
        if (action === "rate-mentor") {
          const mentor = findMentor(id);
          if (mentor) showModal(`Rate ${mentor.name}`, "Save a private note about your experience. This rating is not shared or verified.", mentorRatingForm(mentor));
          return;
        }
        if (action === "book-session") {
          const mentor = findMentor(id);
          if (mentor) showModal(`Request a session with ${mentor.name}`, "Choose a preferred time and prepare an email to the mentor.", bookingForm(mentor));
          return;
        }
        if (action === "save-mentor") {
          if (!incomingMentor || state.connections.some((mentor) => mentor.id === incomingMentor.id)) return;
          if (commit((next) => { next.connections.unshift(incomingMentor); })) {
            render();
            showToast("Mentor profile saved on this device.");
          }
          return;
        }
        if (action === "remove-mentor") {
          if (!confirm("Remove this mentor from your saved profiles?")) return;
          if (commit((next) => { next.connections = next.connections.filter((mentor) => mentor.id !== id); })) render();
          return;
        }
        if (action === "find-mentor") {
          const request = state.requests.find((item) => item.id === id);
          if (!request) return;
          matchQuery = request.course;
          matchRequest = true;
          matchFilters = { course: request.course, programme: state.profile.programme, level: String(state.profile.level), format: "", availability: "", rate: "", applied: true };
          selectedMatchId = "";
          randomMatch = false;
          matchRequest = false;
          navigate("matches");
          return startMatching(false);
        }
        if (action === "close-modal") return closeModal();
        if (action === "theme") {
          if (commit((next) => { next.theme = next.theme === "dark" ? "light" : "dark"; })) {
            render();
            showToast(`${state.theme === "dark" ? "Dark" : "Light"} theme enabled.`);
          }
          return;
        }
        if (action === "add-request") return showModal("Add a study request", "Save a course topic you want to understand. This does not send a request to anyone.", requestForm());
        if (action === "add-plan") return showModal("Plan a study session", "Set a private reminder for your own study time.", planForm());
        if (action === "add-group") return showModal("Create a group invitation", "Prepare a message you can choose to share with classmates.", groupForm());
        if (action === "export") return exportData();
        if (action === "erase") {
          if (!confirm("Erase your LNK profile, requests, plans and invitation drafts from this browser? This cannot be undone. Export a backup first if you need one.")) return;
          try {
            localStorage.removeItem(STORAGE_KEY);
            state = emptyState();
            currentView = "welcome";
            render();
            showToast("Your LNK data was erased from this browser.");
          } catch (error) {
            showToast(`Could not erase local data: ${error.message}`);
          }
          return;
        }
        if (action === "toggle-request") {
          const item = state.requests.find((request) => request.id === id);
          if (!item) return;
          if (commit((next) => { next.requests = next.requests.map((request) => request.id === id ? { ...request, status: request.status === "done" ? "open" : "done" } : request); })) render();
          return;
        }
        if (action === "delete-request") {
          if (!confirm("Delete this study request?")) return;
          if (commit((next) => { next.requests = next.requests.filter((request) => request.id !== id); })) render();
          return;
        }
        if (action === "edit-request") {
          const request = state.requests.find((item) => item.id === id);
          if (request) showModal("Edit study request", "Update this private reminder.", requestForm(request));
          return;
        }
        if (action === "plan-from-request") {
          const request = state.requests.find((item) => item.id === id);
          if (request) showModal("Plan a study session", "Turn this request into a private study reminder.", planForm(null, request));
          return;
        }
        if (action === "toggle-plan") {
          if (commit((next) => { next.plans = next.plans.map((plan) => plan.id === id ? { ...plan, status: plan.status === "done" ? "open" : "done" } : plan); })) render();
          return;
        }
        if (action === "delete-plan") {
          if (!confirm("Delete this study plan?")) return;
          if (commit((next) => { next.plans = next.plans.filter((plan) => plan.id !== id); })) render();
          return;
        }
        if (action === "edit-plan") {
          const plan = state.plans.find((item) => item.id === id);
          if (plan) showModal("Edit study plan", "Update this private study reminder.", planForm(plan));
          return;
        }
        if (action === "share-group") return shareGroup(id);
        if (action === "copy-invite") return copyInvite(id);
        if (action === "edit-group") {
          const group = state.groups.find((item) => item.id === id);
          if (group) showModal("Edit invitation draft", "Update the invitation before sharing it.", groupForm(group));
          return;
        }
        if (action === "delete-group") {
          if (!confirm("Delete this invitation draft?")) return;
          if (commit((next) => { next.groups = next.groups.filter((group) => group.id !== id); })) render();
        }
      }

      document.addEventListener("click", (event) => {
        if (!(event.target instanceof Element)) return;
        const button = event.target.closest("[data-action]");
        if (button) handleAction(button);
        else if (event.target === $("#modal")) closeModal();
      });

      document.addEventListener("submit", (event) => {
        const form = event.target;
        if (!(form instanceof HTMLFormElement)) return;
        event.preventDefault();
        if (form.dataset.form === "profile") handleProfile(form);
        if (form.dataset.form === "mentor-link") handleMentorLink(form);
        if (form.dataset.form === "matching") startMatching(false, form);
        if (form.dataset.form === "request") handleRequest(form);
        if (form.dataset.form === "plan") handlePlan(form);
        if (form.dataset.form === "group") handleGroup(form);
        if (form.dataset.form === "mentor-rating") handleMentorRating(form);
        if (form.dataset.form === "booking") handleBooking(form);
        if (form.dataset.form === "demo-chat") handleDemoChat(form);
      });

      document.addEventListener("input", (event) => {
        const search = event.target;
        if (!(search instanceof HTMLInputElement) || !search.matches("[data-search]")) return;
        const query = search.value.trim().toLocaleLowerCase();
        if (currentView === "matches") {
          matchQuery = query;
          matchRequest = false;
        }
        const terms = query.split(/\s+/).filter(Boolean);
        let visible = 0;
        document.querySelectorAll("[data-searchable]").forEach((item) => {
          item.hidden = !terms.every((term) => item.dataset.searchable.includes(term));
          if (!item.hidden) visible += 1;
        });
        const empty = $("#searchEmpty");
        if (empty) empty.hidden = !query || visible > 0;
      });

      document.addEventListener("change", (event) => {
        const radio = event.target;
        if (radio instanceof HTMLSelectElement && radio.closest("form[data-form='matching']")
          && ["programme", "level"].includes(radio.name)) {
          updateMatchingCourses(radio.form);
          return;
        }
        if (!(radio instanceof HTMLInputElement) || radio.name !== "role" || !radio.checked) return;
        const form = radio.form;
        if (!form || form.dataset.form !== "profile") return;
        const isMentor = radio.value === "mentor";
        const mentorFields = $("#mentorFields", form);
        const email = $("#profileEmail", form);
        const emailLabel = $("label[for='profileEmail'] .muted", form);
        const submit = $("button[type='submit']", form);
        if (mentorFields) mentorFields.hidden = !isMentor;
        if (email) email.required = isMentor;
        if (emailLabel) emailLabel.textContent = isMentor ? "(required for mentees to contact you)" : "(optional)";
        if (submit) submit.textContent = form.dataset.editing === "true"
          ? "Save profile"
          : `Continue as a ${radio.value}`;
        form.querySelectorAll(".role-option").forEach((option) => option.classList.toggle("selected", option.contains(radio)));
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !$("#modal").hidden) closeModal();
        if (event.key === "Tab" && !$("#modal").hidden) {
          const focusable = [...$("#modal").querySelectorAll('button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])')];
          if (!focusable.length) return;
          const first = focusable[0];
          const last = focusable[focusable.length - 1];
          if (event.shiftKey && document.activeElement === first) {
            event.preventDefault();
            last.focus();
          } else if (!event.shiftKey && document.activeElement === last) {
            event.preventDefault();
            first.focus();
          }
        }
      });

      state = loadState();
      render();
    })();
  </script>
</body>
</html>
